name: Update stats

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# No permissions by default; the job asks for what it needs.
permissions: {}

jobs:
  count:
    uses: ./.github/workflows/count-stats.yml

  readme:
    name: Update the NuGet download and star counts
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Writes the counts between the nuget-downloads and github-stars markers in README.md.
      - name: Write the counts
        shell: python
        env:
          DOWNLOADS: ${{ needs.count.outputs.downloads }}
          STARS: ${{ needs.count.outputs.stars }}
        run: |
          import os, re

          with open("README.md", encoding="utf-8", newline="") as file:
              readme = file.read()
          for marker, text in [("nuget-downloads", os.environ["DOWNLOADS"]), ("github-stars", os.environ["STARS"])]:
              readme, count = re.subn(rf"(<!--{marker}-->).*?(<!--/{marker}-->)", rf"\g<1>{text}\g<2>", readme)
              if count != 1:
                  raise SystemExit(f"README.md has no {marker} markers")
          with open("README.md", "w", encoding="utf-8", newline="") as file:
              file.write(readme)

      - name: Commit the new counts
        run: |
          if git diff --quiet; then
            echo "The counts did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the NuGet download and star counts"
          git push
